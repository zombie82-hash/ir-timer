<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B 조건 스톱워치 · 설치 보고서 측정</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#101418">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="B 스톱워치">
<style>
  :root{
    --bg:#101418; --panel:#171c22; --border:#2a3138; --text:#e6e9ec; --sub:#8b959e;
    --accent:#3fa9f5; --accent-dim:#1f4d68; --ok:#4caf7d; --warn:#e0a33d; --err:#e0605a;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Pretendard","Malgun Gothic",sans-serif;
    font-size:15px;line-height:1.55;}
  .wrap{max-width:560px;margin:0 auto;padding:24px 18px 60px;}
  header h1{font-size:19px;margin:0 0 4px;font-weight:600;}
  header h1 .ver{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-dim);
    padding:2px 6px;border-radius:5px;vertical-align:2px;margin-left:6px;}
  header p{margin:0;color:var(--sub);font-size:13px;}

  [hidden]{display:none !important;}
  .notice{display:flex;gap:10px;align-items:flex-start;background:#1b2430;border:1px solid var(--accent-dim);
    border-radius:8px;padding:10px 12px;margin:14px 0 0;font-size:12.5px;line-height:1.5;}
  .notice p{margin:0;}
  .notice button{margin-left:auto;background:none;border:1px solid var(--border);color:var(--sub);
    border-radius:6px;padding:4px 9px;font-size:11.5px;cursor:pointer;flex-shrink:0;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;margin-top:16px;}
  .card h2{font-size:13px;font-weight:600;margin:0 0 14px;color:var(--sub);}

  .clock{font-family:var(--mono);font-size:46px;font-weight:600;text-align:center;
    font-variant-numeric:tabular-nums;letter-spacing:-0.02em;margin:6px 0 2px;color:var(--sub);}
  .clock.run{color:var(--warn);}
  .clock-state{text-align:center;font-size:12.5px;color:var(--sub);margin-bottom:16px;min-height:19px;}

  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  button{font-family:inherit;}
  button.start{background:var(--accent);color:#08141c;border:none;border-radius:8px;
    padding:14px;font-size:15px;font-weight:600;cursor:pointer;}
  button.start:not(:disabled):hover{background:#5cb8f7;}
  button.stop{background:none;border:1px solid var(--err);color:var(--err);border-radius:8px;
    padding:14px;font-size:15px;font-weight:600;cursor:pointer;}
  button.stop:not(:disabled):hover{background:#2a1516;}
  button:disabled{background:var(--border);color:var(--sub);border-color:var(--border);cursor:not-allowed;}

  label{display:block;font-size:12.5px;color:var(--sub);margin:16px 0 5px;}
  input[type=text]{width:100%;background:#0d1114;border:1px solid var(--border);border-radius:7px;
    color:var(--text);padding:9px 11px;font-size:14px;font-family:inherit;}
  input:focus{outline:none;border-color:var(--accent);}

  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;}
  th,td{border-bottom:1px solid var(--border);padding:8px 6px;text-align:right;}
  th{color:var(--sub);font-weight:600;font-size:11.5px;white-space:nowrap;}
  th:first-child,td:first-child{text-align:left;width:56px;}
  th:last-child,td:last-child{text-align:left;}
  td.num{font-family:var(--mono);white-space:nowrap;}
  .empty-row td{text-align:center;color:var(--sub);padding:18px 6px;}

  .summary{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:12.5px;color:var(--sub);}
  .summary b{color:var(--text);font-weight:600;}

  button.secondary{background:none;border:1px solid var(--border);color:var(--text);border-radius:7px;
    padding:10px 14px;font-size:13.5px;cursor:pointer;margin-top:14px;width:100%;}
  button.secondary:hover{border-color:var(--accent);color:var(--accent);}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:#1f2a33;border:1px solid var(--accent-dim);color:var(--text);border-radius:8px;
    padding:10px 16px;font-size:13px;opacity:0;visibility:hidden;transition:opacity .18s,transform .18s,visibility .18s;
    z-index:50;max-width:90vw;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);visibility:visible;}

  .back{display:inline-block;margin-top:20px;font-size:12.5px;color:var(--sub);
    text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px;}
  .back:hover{color:var(--accent);}
  .hint{font-size:11.5px;color:var(--sub);margin-top:8px;line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>B 조건 스톱워치 <span class="ver">v0.2.1</span></h1>
    <p>종이 양식에 직접 작성한 시간을 재는 도구 — 5건 측정 후 폐기</p>
  </header>

  <div class="notice" id="originNotice" hidden>
    <p>이 주소의 기록은 <b>새로 시작됩니다</b> (이전 file:// 기록과 이어지지 않습니다).</p>
    <button id="originNoticeOk">확인</button>
  </div>

  <div class="card">
    <div class="clock" id="clock">0.0</div>
    <div class="clock-state" id="clockState">대기 — [시작]을 누르세요</div>
    <div class="btns">
      <button class="start" id="startBtn">시작</button>
      <button class="stop" id="stopBtn" disabled>정지</button>
    </div>

    <label for="memo">메모 (선택)</label>
    <input type="text" id="memo" placeholder="예: 1번째 — 3층 AP 4대">

    <div class="hint">종이 양식 작성을 시작할 때 [시작], 끝났을 때 [정지]. [정지] 한 번에 기록 1건이 추가됩니다.</div>
  </div>

  <div class="card">
    <h2>기록 <span id="recCount" style="color:var(--sub);font-weight:400;"></span></h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>회차</th><th>소요(초)</th><th>메모</th></tr>
        </thead>
        <tbody id="recBody"></tbody>
      </table>
    </div>
    <div class="summary" id="summary">기록 없음</div>
    <button class="secondary" id="exportBtn">JSON 내보내기</button>
    <div class="hint">내보낸 파일(<code>b_records_*.json</code>)은 A 조건 기록과 나중에 합쳐 비교합니다.</div>
  </div>

  <a class="back" href="./index.html">← 설치 보고서 생성기(A 조건)</a>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  const $ = id => document.getElementById(id);
  const STORE = 'bRecords';                 // B 조건 기록 키
  const NOTICE_KEY = 'notice_b_origin';

  let records = [];
  let startAt = null;                       // performance.now()
  let rafId = null;

  const fmt = sec => (sec == null || !isFinite(sec)) ? '—' : Number(sec).toFixed(1);

  function stamp(dt){
    const p = n => String(n).padStart(2, '0');
    return dt.getFullYear() + '-' + p(dt.getMonth() + 1) + '-' + p(dt.getDate()) +
           ' ' + p(dt.getHours()) + ':' + p(dt.getMinutes());
  }

  /* ---------- 표시 ---------- */
  let toastTimer = null;
  function toast(msg){
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }

  function elapsedSec(){
    return startAt == null ? null : (performance.now() - startAt) / 1000;
  }

  function renderClock(){
    const sec = elapsedSec();
    const running = startAt != null;
    $('clock').textContent = running ? fmt(sec) : (records.length ? '0.0' : '0.0');
    $('clock').classList.toggle('run', running);
    $('clockState').textContent = running
      ? '측정 중 — 끝나면 [정지]'
      : (records.length ? '대기 — 다음 회차' : '대기 — [시작]을 누르세요');
    $('startBtn').disabled = running;
    $('stopBtn').disabled = !running;
  }

  function ensureTicker(){
    if(rafId != null) return;
    const step = () => {
      rafId = null;
      renderClock();
      if(startAt != null) rafId = requestAnimationFrame(step);
    };
    rafId = requestAnimationFrame(step);
  }

  /* ---------- 저장 ---------- */
  function loadRecords(){
    let raw = null;
    try{ raw = localStorage.getItem(STORE); }catch(e){}
    if(!raw){ records = []; return; }
    try{
      const arr = JSON.parse(raw);
      if(!Array.isArray(arr)) throw new Error('not an array');
      records = arr.filter(r => r && typeof r === 'object');
    }catch(e){
      try{ localStorage.setItem(STORE + '_corrupt_' + Date.now(), raw); }catch(_){}
      records = [];
      toast('저장된 기록을 읽지 못했습니다. 원본은 백업 키로 보존했습니다.');
    }
  }

  function persist(){
    try{
      localStorage.setItem(STORE, JSON.stringify(records));
      return true;
    }catch(e){
      toast('기록을 저장하지 못했습니다. [JSON 내보내기]로 먼저 백업하세요.');
      return false;
    }
  }

  function renderRecords(){
    const body = $('recBody');
    body.textContent = '';
    $('recCount').textContent = records.length ? '· ' + records.length + '건' : '';

    if(!records.length){
      const tr = document.createElement('tr');
      tr.className = 'empty-row';
      const td = document.createElement('td');
      td.colSpan = 3;
      td.textContent = '아직 기록이 없습니다. [시작] → [정지]로 한 건이 추가됩니다.';
      tr.appendChild(td);
      body.appendChild(tr);
      $('summary').textContent = '기록 없음';
      return;
    }

    records.forEach((r, i) => {
      const tr = document.createElement('tr');
      [
        { text: String(i + 1), cls: '' },
        { text: fmt(r.sec), cls: 'num' },
        { text: r.memo || '—', cls: '' }
      ].forEach(c => {
        const td = document.createElement('td');
        if(c.cls) td.className = c.cls;
        td.textContent = c.text;
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });

    const total = records.reduce((a, r) => a + (Number(r.sec) || 0), 0);
    $('summary').textContent = '';
    const div = document.createElement('div');
    div.textContent = '전체 ' + records.length + '건 · 평균 ';
    const b1 = document.createElement('b');
    b1.textContent = fmt(total / records.length);
    const b2 = document.createElement('b');
    b2.textContent = fmt(total);
    div.appendChild(b1);
    div.appendChild(document.createTextNode('초 · 합계 '));
    div.appendChild(b2);
    div.appendChild(document.createTextNode('초'));
    $('summary').appendChild(div);
  }

  /* ---------- 동작 ---------- */
  $('startBtn').addEventListener('click', () => {
    if(startAt != null) return;
    startAt = performance.now();
    $('clock').textContent = '0.0';
    $('memo').value = '';           // 회차마다 메모를 새로 적는다
    renderClock();
    ensureTicker();
  });

  $('stopBtn').addEventListener('click', () => {
    if(startAt == null) return;

    const sec = Math.round((performance.now() - startAt) / 100) / 10;   // 0.1초 단위
    startAt = null;

    const nowDt = new Date();
    records.push({
      mode: 'B',
      round: records.length + 1,
      sec: sec,
      memo: $('memo').value.trim(),
      ts: nowDt.toISOString(),
      date: stamp(nowDt),
      app: 'v0.2.1'
    });
    persist();
    renderRecords();
    renderClock();
    $('memo').value = '';
    toast('기록 ' + records.length + '건 — ' + fmt(sec) + '초');
  });

  $('memo').addEventListener('keydown', e => {
    if(e.key === 'Enter') e.preventDefault();
  });

  /* ---------- 내보내기 ---------- */
  $('exportBtn').addEventListener('click', () => {
    if(!records.length){ toast('내보낼 기록이 없습니다.'); return; }
    const name = 'b_records_' + stamp(new Date()).replace(/[: ]/g, '') + '.json';
    try{
      const blob = new Blob([JSON.stringify(records, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => { try{ URL.revokeObjectURL(url); }catch(e){} }, 1500);
      toast('내보냈습니다: ' + name);
    }catch(e){
      toast('파일 저장이 막혀 있습니다. 브라우저 권한을 확인하세요.');
    }
  });

  /* ---------- 시작 ---------- */
  loadRecords();
  renderRecords();
  renderClock();

  let noticeSeen = false;
  try{ noticeSeen = localStorage.getItem(NOTICE_KEY) === 'done'; }catch(e){ noticeSeen = false; }
  if(!noticeSeen) $('originNotice').hidden = false;
  $('originNoticeOk').addEventListener('click', () => {
    $('originNotice').hidden = true;
    try{ localStorage.setItem(NOTICE_KEY, 'done'); }catch(e){}
  });

  const swOk = 'serviceWorker' in navigator &&
    (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1');
  if(swOk){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => {
        if(window.console) console.warn('Service Worker 등록 실패:', err);
      });
    });
  }
})();
</script>
</body>
</html>
